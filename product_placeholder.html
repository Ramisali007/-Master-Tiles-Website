<!DOCTYPE html>
<html>
<head>
    <title>Product Placeholder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .product {
            width: 300px;
            height: 220px;
            position: relative;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 24px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: transform 0.5s ease;
        }
        .product:hover {
            transform: translateY(-10px) rotateY(10deg);
        }
        .product::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            z-index: 1;
        }
        .product::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.4), rgba(0,0,0,0));
            z-index: 1;
        }
        #product1 {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        #product2 {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }
        #product3 {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
        .product-content {
            position: relative;
            z-index: 2;
            padding: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .product-shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 2;
        }
        .product:hover .product-shine {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="product1" class="product">
        <div class="product-content">PRODUCT 1</div>
        <div class="product-shine"></div>
    </div>
    <!-- Change to product2 or product3 as needed -->

    <script>
        // Add 3D tilt effect
        const product = document.querySelector('.product');

        product.addEventListener('mousemove', (e) => {
            const rect = product.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const xPercent = x / rect.width;
            const yPercent = y / rect.height;

            const rotateX = (0.5 - yPercent) * 10;
            const rotateY = (xPercent - 0.5) * 10;

            product.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-10px)`;

            // Update shine position
            const shine = product.querySelector('.product-shine');
            shine.style.backgroundPosition = `${x}px ${y}px`;
        });

        product.addEventListener('mouseleave', () => {
            product.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateY(0)';
        });
    </script>
</body>
</html>
