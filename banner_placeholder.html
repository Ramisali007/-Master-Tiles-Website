<!DOCTYPE html>
<html>
<head>
    <title>Banner Placeholder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .banner {
            width: 1200px;
            height: 500px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 36px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="banner">PREMIUM TILES FOR ELEGANT LIVING</div>
</body>
</html>
